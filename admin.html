<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#122e36" />
    <title>Boardroom · Administration</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-area="admin">
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <div class="bar">
        <a href="./index.html" class="brand"
          ><b aria-hidden="true">B</b> Boardroom</a
        ><span>Administration</span><button id="exit" hidden>Sign out</button>
      </div>
    </header>
    <main id="main">
      <section id="gate">
        <div class="intro">
          <small>Chitkara Business School · Semester 1</small>
          <h1>Administration</h1>
          <p>Review student activity, course coverage and announcements.</p>
        </div>
        <form id="login">
          <h2>Administrator sign in</h2>
          <label
            >Email address<input
              id="email"
              type="email"
              autocomplete="username"
              required
              placeholder="Admin email" /></label
          ><label
            >Boardroom password<input
              id="pass"
              type="password"
              autocomplete="current-password"
              required /></label
          ><button class="primary" id="signin">Sign in</button
          ><button type="button" class="link" id="reset">Reset password</button>
          <p id="authmsg" role="status"></p>
        </form>
      </section>
      <section id="desk" hidden></section>
      <p role="status" id="status"></p>
    </main>
    <footer>
      Boardroom · Independent student study portal
      <a href="./index.html">Student workspace</a>
    </footer>
    <script type="module" src="./portal.js"></script>
  </body>
</html>
